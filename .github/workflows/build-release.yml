name: Build Release (All Platforms)

# 四端发版：macOS(dmg) / Windows(nsis) / Linux(AppImage) / Android(apk)
# 触发：推送 v* tag，或手动 workflow_dispatch 指定版本。
# 各平台在对应 runner 上构建，产物上传到「同一次」GitHub Release（先建 draft，人工核对后再发布）。
# 安卓签名：若仓库配置了 ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_PASSWORD 四个 Secret，则打签名 release 包；否则 assembleRelease 产出未签名 APK（无法安装）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v0.2.0'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" \
              --notes "Automated multi-platform build: macOS (dmg), Windows (nsis), Linux (AppImage), Android (apk)." \
              --draft
          fi

  build-mac:
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          PHANTOMJS_SKIP_DOWNLOAD=true npm install --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Build renderer + main
        run: npm run build
      - name: Package macOS (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder build -m -p never
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ needs.meta.outputs.tag }}" release/build/*.dmg --clobber

  build-win:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          # Windows runner 默认 shell 是 pwsh，内联 env 前缀不可用，故显式用 bash。
          # 删除 package-lock.json 以规避 npm 跨平台 optionalDependencies Bug（npm/cli#4828，
          # 表现为 @rollup/rollup-win-x64-msvc 找不到）。
          rm -rf node_modules package-lock.json
          PHANTOMJS_SKIP_DOWNLOAD=true npm install --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Build renderer + main
        run: npm run build
      - name: Package Windows (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder build -w -p never
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release upload "${{ needs.meta.outputs.tag }}" "release/build/*.exe" --clobber

  build-linux:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          # 删除 package-lock.json 以规避 npm 跨平台 optionalDependencies Bug（npm/cli#4828，
          # 表现为 @rollup/rollup-linux-x64-gnu 找不到）。
          rm -rf node_modules package-lock.json
          PHANTOMJS_SKIP_DOWNLOAD=true npm install --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Build renderer + main
        run: npm run build
      - name: Package Linux (AppImage)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder build -l -p never
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ needs.meta.outputs.tag }}" release/build/*.AppImage --clobber

  build-android:
    needs: meta
    runs-on: ubuntu-latest
    env:
      # 手动安装 Android SDK 需要显式指定路径，gradlew 与 sdkmanager 都依赖它。
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Install Android command-line tools
        run: |
          # android-actions/setup-android@v3 内部硬编码 `sdkmanager tools`（该包早已下架），
          # 会导致 exit 1。这里改为手动安装 cmdline-tools，完全可控。
          SDK="$ANDROID_HOME"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -o -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install SDK packages and accept licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Install dependencies
        run: |
          # 删除 lock 规避 npm 跨平台 optionalDependencies Bug（同 Linux/Windows）。
          # 安卓只需 web 构建产物，跳过 electron 二进制下载以加快构建。
          rm -rf node_modules package-lock.json
          PHANTOMJS_SKIP_DOWNLOAD=true ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm install --no-audit --no-fund
      - name: Build web assets
        run: npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Decode signing keystore (if provided)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 未配置，跳过签名（将产出未签名 APK）"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release-key.jks
          printf 'storeFile=release-key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/keystore.properties
      - name: Build release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          gh release upload "${{ needs.meta.outputs.tag }}" "$APK" --clobber
